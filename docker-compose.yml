version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kayfa-agentic-lms
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
    volumes:
      - .:/app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
