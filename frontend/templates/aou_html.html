<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kayfa Learning Platform - AI Learning Portal">
    <title>Kayfa Learning Platform</title>
    <link rel="stylesheet" href="../static/css/aou_css.css">
    <link rel="stylesheet" href="../static/css/tracing_css.css">
</head>

<body>

    <main id="loginView" class="view" aria-label="Login page">
        <header class="topbar">
            <div class="topbar-logo">
                <div class="logo-mark" aria-hidden="true">Kayfa - كيف</div>
                <div class="logo-text">
                    <span class="logo-line1">Kayfa learning Platform</span>
                    <span class="logo-line2"></span>
                </div>
            </div>
            <div class="topbar-right">
                <button type="button" class="lang-toggle" aria-label="Change language">🌐 EN</button>
            </div>
        </header>

        <section class="login-stage">
            <div class="login-card">
                <section class="login-form-side">
                    <div class="login-flag" aria-hidden="true">🇪🇬</div>
                    <div class="login-title">Kayfa - كيف</div>
                    <h1 class="login-heading">Welcome to Kayfa</h1>
                    <p class="login-sub">Sign in to your learning account</p>

                    <form id="loginForm" autocomplete="on">
                        <div class="form-group">
                            <label class="field-label" for="usernameInput">Username</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">👤</span>
                                <input type="text" id="usernameInput" name="username" placeholder="Enter your username"
                                    autocomplete="username" maxlength="100" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="field-label" for="roleInput">Account Type</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">🎓</span>
                                <select id="roleInput" name="role" required>
                                    <option value="" selected disabled>Select your role</option>
                                    <option value="Student">Student</option>
                                    <option value="Instructor">Instructor</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="field-label" for="passwordInput">Password</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">🔒</span>
                                <input type="password" id="passwordInput" name="password"
                                    placeholder="Enter your password" autocomplete="current-password"
                                    maxlength="200" required>
                                <button type="button" class="input-eye" id="togglePassword"
                                    aria-label="Show password">👁</button>
                            </div>
                        </div>

                        <div id="loginError" class="login-error" role="alert" aria-live="polite"></div>

                        <button type="submit" id="loginButton" class="btn-login">
                            <span id="loginButtonText">Login</span>
                            <span id="loginSpinner" class="button-spinner" hidden>⏳</span>
                        </button>
                    </form>
                </section>

                <aside class="login-visual-side">
                    <div class="visual-overlay">
                        <div class="visual-icon" aria-hidden="true"></div>
                        <div class="visual-caption">Manage your academic life<br>with Kayfa AI.</div>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <main id="dashboardView" class="view" style="display:none;">
        <header class="dash-navbar">
            <div class="dash-logo">
                <div class="logo-mark small" aria-hidden="true">Kayfa - كيف</div>
                <div class="logo-text">
                    <span class="logo-line1">Kayfa learning Platform</span>
                    <span class="logo-line2"></span>
                </div>
            </div>

            <div class="dash-user">
                <span class="user-icon" aria-hidden="true">👤</span>
                <div class="user-meta">
                    <span class="user-id" id="navUserId">—</span>
                    <span class="user-name" id="navUserName">—</span>
                </div>
                <span class="user-role" id="navUserRole">—</span>
                <button type="button" class="logout-button" id="logoutBtn">Logout</button>
            </div>
        </header>

        <section class="dash-content" id="dashContent">
            <div id="dashboardStatus" class="dashboard-status" aria-live="polite"></div>
            <div id="roleContent"></div>
        </section>

        <button id="aiAvatarBtn" class="ai-avatar" title="Open Kayfa AI" aria-label="Open Kayfa AI assistant">
            <span class="ai-avatar-icon" aria-hidden="true"></span>
        </button>

        <aside id="aiPanel" class="ai-panel" aria-label="Kayfa AI Assistant">
            <header class="ai-panel-header">
                <div class="ai-panel-title"><span class="ai-dot"></span>Kayfa AI Assistant</div>
                <button id="aiCloseBtn" class="ai-close-btn" type="button" aria-label="Close AI assistant">✕</button>
            </header>
            <div class="ai-panel-body" id="aiMessages" aria-live="polite"></div>
            <div class="ai-panel-input">
                <input type="text" id="aiInputBox" placeholder="Ask Kayfa AI..." maxlength="4000" autocomplete="off">
                <button id="aiSendBtn" type="button" aria-label="Send message">➤</button>
            </div>
        </aside>
    </main>
    <script src="../static/js/aou_js.js"></script>
</body>

</html>
