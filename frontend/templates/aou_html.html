<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kayfa Agentic LMS">
    <title>Kayfa | Agentic LMS</title>
    <link rel="stylesheet" href="../static/css/aou_css.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <main id="loginView" class="view" aria-label="Login page">
        <section class="login-stage">
            <div class="login-card">
                <section class="login-form-side">
                    <div style="text-align: center; margin-bottom: 24px;">
                        <img src="../static/kayfa_logo_Blue.png" alt="Kayfa Logo"
                            style="height: 60px; object-fit: contain;">
                    </div>
                    <h1 class="login-heading">Welcome to Kayfa LMS</h1>
                    <p class="login-sub">Sign in to interact with your AI Agent</p>

                    <form id="loginForm" autocomplete="on">
                        <div class="form-group">
                            <label class="field-label" for="userIdInput">Email / User ID</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">👤</span>
                                <input type="text" id="userIdInput" name="user_id"
                                    placeholder="Enter your ID or Admin Email" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="field-label" for="roleInput">Account Type</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">🎓</span>
                                <select id="roleInput" name="role" required>
                                    <option value="" selected disabled>Select your role</option>
                                    <option value="Student">Student</option>
                                    <option value="Instructor">Instructor</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="field-label" for="passwordInput">Password</label>
                            <div class="input-wrap">
                                <span class="input-icon" aria-hidden="true">🔒</span>
                                <input type="password" id="passwordInput" name="password"
                                    placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div id="loginError" class="login-error" role="alert"></div>

                        <button type="submit" id="loginButton" class="btn-login">
                            <span id="loginButtonText">Login</span>
                        </button>
                    </form>
                </section>
            </div>
        </section>
    </main>

    <!-- AI AGENT HOME PAGE -->
    <main id="dashboardView" class="view" style="display:none; height: 100vh; flex-direction: column;">
        <header class="dash-navbar">
            <div class="dash-logo">
                <img src="../static/kayfa_logo_white.png" alt="Kayfa Logo" style="height: 35px; object-fit: contain;">
                <span
                    style="font-weight: bold; font-size: 18px; border-left: 2px solid rgba(255,255,255,0.3); padding-left: 10px; margin-left: 10px;">Agentic
                    LMS</span>
            </div>
            <div class="dash-user">
                <span class="user-name" id="navUserName">—</span>
                <span class="user-role" id="navUserRole">—</span>
                <button type="button" class="logout-button" id="logoutBtn">Logout</button>
            </div>
        </header>

        <section class="dash-content full-chat-layout">
            <div class="main-chat-container">
                <div class="ai-panel-body" id="aiMessages" aria-live="polite"></div>
                <div class="ai-panel-input">
                    <input type="text" id="aiInputBox" placeholder="Message the Kayfa Agent..." autocomplete="off">
                    <button id="aiSendBtn" type="button">➤</button>
                </div>
            </div>
        </section>
    </main>

    <script src="../static/js/aou_js.js"></script>
</body>

</html>
